<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Reports — ResQTrack</title>
  <link rel="icon" type="image/png" href="/public/images/favicon.png">
  <link rel="stylesheet" href="/public/css/output.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous">
</head>
<body class="bg-gray-50 font-sans min-h-screen">

  <nav class="bg-white border-b border-gray-200 sticky top-0 z-40">
    <div id="portal-preview-bar"></div>
    <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="/pages/client/home.html" class="text-gray-500 hover:text-gray-700 flex items-center gap-2 text-sm">
          <i class="fa-solid fa-arrow-left"></i> Home
        </a>
        <span class="font-semibold text-gray-800">My Reports</span>
      </div>
      <div class="flex items-center gap-3">
        <a href="/pages/client/report-incident.html" class="btn-danger btn-sm text-xs">
          <i class="fa-solid fa-plus mr-1"></i> New Report
        </a>
      </div>
    </div>
  </nav>

  <div class="max-w-4xl mx-auto px-4 py-6">

    <div id="reports-container" class="space-y-4">
      <div class="text-center py-12 text-gray-400">
        <i class="fa-solid fa-spinner fa-spin text-2xl mb-3"></i>
        <p>Loading your reports…</p>
      </div>
    </div>

  </div>

  <!-- Report Detail Modal -->
  <div id="detail-modal" class="modal-overlay hidden">
    <div class="modal-box max-w-4xl">
      <div class="modal-header">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center font-bold text-base">
            <i class="fa-solid fa-file-lines"></i>
          </div>
          <div>
            <h3 class="font-bold text-gray-800 text-lg" id="modal-ref">Incident Details</h3>
            <p class="text-xs text-gray-400">Report details and real-time response timeline</p>
          </div>
        </div>
        <button onclick="closeDetailModal()" class="text-gray-400 hover:text-gray-600 p-1 transition-colors"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <div class="modal-body">
        <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
          <div class="md:col-span-7 space-y-4" id="modal-content"></div>
          <div class="md:col-span-5 space-y-3 bg-gray-50/80 p-4 rounded-xl border border-gray-200">
            <h4 class="font-bold text-gray-700 text-xs uppercase tracking-wider flex items-center gap-1.5">
              <i class="fa-solid fa-clock-rotate-left text-blue-500"></i> Activity Timeline
            </h4>
            <div id="modal-timeline" class="space-y-3 max-h-80 overflow-y-auto pr-1"></div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button onclick="closeDetailModal()" class="btn-secondary btn-sm ml-auto px-6">Close</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/shared/auth.js"></script>
  <script src="/js/shared/api.js"></script>
  <script src="/js/client/my-reports.js"></script>
</body>
</html>
